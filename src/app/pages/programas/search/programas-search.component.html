<form [formGroup]="programasPesquisaForm">
  <div class="col-12 d-flex flex-column flex-md-row align-items-center justify-content-end">
    <div class="col-12 col-md-3 col-lg-3 px-md-2 mb-2 mb-md-0">
      <div #statusField>
      <p-dropdown
        siscapCloseOnScroll
        inputId="statusPrograma"
        formControlName="status"
        [options]="programasStatusOpcoes"
        optionLabel="label"
        optionValue="value"
        styleClass="siscap-search-dropdown"
        panelStyleClass="siscap-search-dropdown-panel"
        [style]="{ width: '100%' }"
        [panelStyle]="{ width: statusField.clientWidth + 'px' }"
        ariaLabel="Status do programa"
        appendTo="body"
      ></p-dropdown>
      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-3">
      <input
        class="form-control"
        type="text"
        name="sigla_titulo"
        id="sigla_titulo"
        placeholder="{{ MENSAGENS.PESQUISAR }}"
        formControlName="porTermo"
      />
    </div>
  </div>
</form>

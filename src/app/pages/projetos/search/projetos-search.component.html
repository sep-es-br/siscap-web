<form [formGroup]="projetosPesquisaForm">
  <div
    class="col-12 d-flex flex-column-reverse flex-md-row-reverse align-items-center"
  >
    <div class="col-12 col-md-6 col-lg-3">
      <input
        type="text"
        name="sigla_titulo"
        id="sigla_titulo"
        class="form-control"
        placeholder="Pesquisar"
        formControlName="siglaOuTitulo"
      />
    </div>

    <div class="col-12 col-md-3 col-lg-3 px-md-2 mb-2 mb-md-0">
      <select
        name="status"
        id="status"
        formControlName="status"
        class="select-filtro-pesquisa"
      >
        <option
          [value]="statusProjeto"
          *ngFor="let statusProjeto of statusProjetoOpcoes"
        >
          {{ statusProjeto }}
        </option>
      </select>
    </div>

    <div class="col-12 col-md-3 col-lg-6 px-md-2 mb-2 mb-md-0">
      <select
        name="idOrganizacao"
        id="idOrganizacao"
        formControlName="idOrganizacao"
        class="select-filtro-pesquisa"
      >
        <option
          [value]="organizacao.id"
          *ngFor="let organizacao of organizacoesOpcoes"
        >
          {{ organizacao.nome }}
        </option>
      </select>
    </div>
  </div>
</form>

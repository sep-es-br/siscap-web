<form [formGroup]="projetosPesquisaForm">
  <div
    class="col-12 d-flex flex-column-reverse flex-md-row-reverse align-items-center"
  >
    <div class="col-12 col-md-6 col-lg-3">
      <input
        type="text"
        name="sigla_titulo"
        id="sigla_titulo"
        class="form-control"
        placeholder="{{ MENSAGENS.PESQUISAR }}"
        formControlName="siglaOuTitulo"
      />
    </div>

    <div class="col-12 col-md-3 col-lg-3 px-md-2 mb-2 mb-md-0">
      <div #statusField>
      <p-dropdown
        siscapCloseOnScroll
        inputId="status"
        styleClass="siscap-search-dropdown"
        panelStyleClass="siscap-search-dropdown-panel"
        formControlName="status"
        [options]="statusProjetoOpcoes"
        [panelStyle]="{ width: statusField.clientWidth + 'px' }"
        [style]="{ width: '100%' }"
        ariaLabel="Status"
        appendTo="body"
      ></p-dropdown>
      </div>
    </div>

    <div class="col-12 col-md-3 col-lg-6 pe-md-2 mb-2 mb-md-0">
      <div #organizationField>
      <p-dropdown
        siscapCloseOnScroll
        inputId="idOrganizacao"
        styleClass="siscap-search-dropdown"
        panelStyleClass="siscap-search-dropdown-panel"
        formControlName="idOrganizacao"
        [options]="organizacoesOpcoes"
        [panelStyle]="{ width: organizationField.clientWidth + 'px' }"
        optionLabel="nome"
        optionValue="id"
        [filter]="true"
        filterBy="nome"
        filterPlaceholder="Pesquisar organização"
        [resetFilterOnHide]="true"
        [style]="{ width: '100%' }"
        ariaLabel="Organização"
        appendTo="body"
      ></p-dropdown>
      </div>
    </div>
  </div>
</form>

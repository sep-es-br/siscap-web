<!-- OVERLAY -->
<div
    class="modal-overlay show"
    (click)="fecharModal()">
</div>

<!-- MODAL -->
<div class="filter-modal show">

    <!-- HEADER -->
    <div class="modal-header">
        <h2 class="card-title">
            FILTROS PLANEJAMENTO
        </h2>

        <button
            type="button"
            class="close-modal"
            aria-label="Fechar"
            (click)="fecharModal()">
            ✕
        </button>
    </div>

    <!-- BODY -->
    <div class="filter-body">

        <div class="filter-grid">

            <!-- ÁREA TEMÁTICA -->
            <div class="filter-field">
                <label class="filter-label">
                    Área Temática
                </label>

                <ng-select
                    [items]="areasTematicas"
                    bindLabel="nome"
                    bindValue="id"
                    [(ngModel)]="filtro.idsAreasTematicas"
                    [multiple]="true"
                    [closeOnSelect]="false"
                    [searchable]="true"
                    [clearable]="true"
                    [disabled]="somenteLeitura"
                    placeholder="Selecione..."
                    class="select-filtro"
                    (change)="onAreasTematicasChange()">

                    <ng-template
                        ng-option-tmp
                        let-item="item"
                        let-item$="item$">

                        <div class="select-option-checkbox">
                            <input
                                type="checkbox"
                                tabindex="-1"
                                [checked]="item$.selected"
                                style="margin-right: 8px; pointer-events: none;" />

                            <span>{{ item.nome }}</span>
                        </div>
                    </ng-template>

                    <ng-template
                        ng-multi-label-tmp
                        let-items="items">

                        <span
                            class="custom-selected-label"
                            *ngIf="items.length === 1">
                            {{ items[0].nome }}
                        </span>

                        <span
                            class="custom-selected-label"
                            *ngIf="items.length > 1">
                            {{ items.length }} selecionadas
                        </span>
                    </ng-template>

                </ng-select>
            </div>

            <!-- PROGRAMA -->
            <div class="filter-field">
                <label class="filter-label">
                    Programa
                </label>

                <ng-select
                    [items]="programas"
                    bindLabel="nome"
                    bindValue="id"
                    [(ngModel)]="filtro.idsProgramas"
                    [multiple]="true"
                    [closeOnSelect]="false"
                    [searchable]="true"
                    [clearable]="true"
                    [disabled]="
                        somenteLeitura ||
                        !filtro.idsAreasTematicas?.length
                    "
                    [placeholder]="
                        filtro.idsAreasTematicas?.length
                            ? 'Selecione...'
                            : 'Selecione uma Área primeiro...'
                    "
                    class="select-filtro"
                    (change)="onProgramasChange()">

                    <ng-template
                        ng-option-tmp
                        let-item="item"
                        let-item$="item$">

                        <div class="select-option-checkbox">
                            <input
                                type="checkbox"
                                tabindex="-1"
                                [checked]="item$.selected"
                                style="margin-right: 8px; pointer-events: none;" />

                            <span>{{ item.nome }}</span>
                        </div>
                    </ng-template>

                    <ng-template
                        ng-multi-label-tmp
                        let-items="items">

                        <span
                            class="custom-selected-label"
                            *ngIf="items.length === 1">
                            {{ items[0].nome }}
                        </span>

                        <span
                            class="custom-selected-label"
                            *ngIf="items.length > 1">
                            {{ items.length }} selecionados
                        </span>
                    </ng-template>

                </ng-select>
            </div>

            <!-- AÇÃO -->
            <div class="filter-field">
                <label class="filter-label">
                    Ação
                </label>

                <ng-select
                    [items]="acoes"
                    bindLabel="nome"
                    bindValue="id"
                    [(ngModel)]="filtro.idsAcoes"
                    [multiple]="true"
                    [closeOnSelect]="false"
                    [searchable]="true"
                    [clearable]="true"
                    [disabled]="
                        somenteLeitura ||
                        !filtro.idsProgramas?.length
                    "
                    [placeholder]="
                        filtro.idsProgramas?.length
                            ? 'Selecione...'
                            : 'Selecione um Programa primeiro...'
                    "
                    class="select-filtro">

                    <ng-template
                        ng-option-tmp
                        let-item="item"
                        let-item$="item$">

                        <div class="select-option-checkbox">
                            <input
                                type="checkbox"
                                tabindex="-1"
                                [checked]="item$.selected"
                                style="margin-right: 8px; pointer-events: none;" />

                            <span>{{ item.nome }}</span>
                        </div>
                    </ng-template>

                    <ng-template
                        ng-multi-label-tmp
                        let-items="items">

                        <span
                            class="custom-selected-label"
                            *ngIf="items.length === 1">
                            {{ items[0].nome }}
                        </span>

                        <span
                            class="custom-selected-label"
                            *ngIf="items.length > 1">
                            {{ items.length }} selecionadas
                        </span>
                    </ng-template>

                </ng-select>
            </div>

        </div>

    </div>

    <!-- FOOTER -->
    <div class="modal-footer">

        <button
            type="button"
            class="btn-restaurar"
            [disabled]="somenteLeitura"
            (click)="resetar()">
            RESTAURAR FILTROS
        </button>

        <button
            type="button"
            class="btn-filtrar"
            (click)="applyFilter()">
            FILTRAR
        </button>

    </div>

</div>

<section class="planejamento-section">
  <div class="planejamento-filtros">
    <siscap-filter-card
      [chips]="chips"
      [groupByField]="true"
      [disabled]="!podeEditar || naoPrevistoPpa"
      [loading]="carregandoDadosIniciais || carregandoAcoes"
      (openFilter)="abrirFiltroPlanejamento()"
      (chipRemove)="removeChip($event)"
    >
    </siscap-filter-card>
    <div class="d-flex justify-content-end">
      <label
        class="nao-previsto-ppa"
        [class.nao-previsto-ppa-ativo]="naoPrevistoPpa"
        [class.nao-previsto-ppa-desabilitado]="!podeEditar"
      >
        <input
          type="checkbox"
          [checked]="naoPrevistoPpa"
          [disabled]="!podeEditar"
          (change)="onNaoPrevistoPpaChange($event)"
        />
        <span>
          <validation-message [control]="getControl('naoPrevistoNoPpa')">
            {{
              formatarMensagem(MENSAGENS.NAO_PREVISTO_NO_PPA_VALOR, {
                p0: periodoPlanejamento?.descricao,
              })
            }}</validation-message
          >
        </span>
      </label>
    </div>
  </div>

  <siscap-filtro-ppa-loa
    *ngIf="showModal"
    [filtroAtual]="currentFilter"
    [bloquearAno]="quantidadeAcoes > 0"
    (apply)="onApply($event)"
    (close)="showModal = false"
    (restaurar)="onRestaurar()"
    [somenteLeitura]="somenteLeitura"
  ></siscap-filtro-ppa-loa>

  <siscap-selecao-acoes-planejamento
    [acoes]="acoesDisponiveisView"
    [possuiAcoes]="listaAcoes.length > 0"
    [carregando]="carregandoAcoes"
    [podeEditar]="podeEditar"
    [todosSelecionados]="selectAll"
    [filtroTexto]="filtroTexto"
    [textoAjuda]="projetoPPAListTooltip['selecionePPA']"
    (buscaAlterada)="filtroTexto = $event; filtrarAcoes()"
    (selecionarTodos)="toggleSelectAll({ checked: $event })"
    (alternarAcao)="toggleAcao($event)"
  ></siscap-selecao-acoes-planejamento>
  <!-- Ações selecionadas -->
  <div class="planejamento-card">
    <header class="planejamento-card-header">
      <h2 class="siscap-text-subtitle planejamento-card-title">
        <validation-message [control]="getControl('acoesPlanejamentoProjeto')">
          {{ MENSAGENS.ACOES_DO_PLANEJAMENTO }}
        </validation-message>
      </h2>
    </header>
    <div class="card-selecionados" [class.card-selecionados--vazio]="!carregandoAcoes && quantidadeAcoes === 0">
      <ng-container *ngIf="!carregandoAcoes">
        <!-- Carregamento local -->
        <div
          *ngIf="carregandoAcoes"
          class="planejamento-acoes-loading"
          role="status"
          aria-live="polite"
          attr.aria-label="{{ MENSAGENS.CARREGANDO_ACOES_DO_PLANEJAMENTO }}"
        >
          <div class="spinner-border text-primary" aria-hidden="true"></div>

          <span class="planejamento-acoes-loading-texto">
            {{ MENSAGENS.CARREGANDO_ACOES_DO_PLANEJAMENTO_2 }}
          </span>
        </div>

        <!-- Estado vazio -->
        <ng-container *ngIf="quantidadeAcoes === 0">

          <div class="planejamento-empty-title">
            {{ MENSAGENS.NENHUMA_ACAO_SELECIONADA }}
          </div>
        </ng-container>

        <!-- Lista de ações -->
        <div class="planejamento-cards-container" *ngIf="quantidadeAcoes > 0">
          <siscap-acao-planejamento-card
            *ngFor="let acao of acoesPlanejamento; trackBy: trackByAcao"
            [acao]="acao"
            [periodoDescricao]="periodoPlanejamento?.descricao ?? null"
            [exibirRemocao]="!somenteLeitura"
            [podeEditar]="podeEditar"
            (remover)="onRemoverAcao(acao)"
          ></siscap-acao-planejamento-card>
        </div>
      </ng-container>
    </div>
  </div>

  <div class="siscap-mt-16">
    <ng-content select="[planoSetorial]"></ng-content>
  </div>

  <div class="siscap-form-navigation">
    <button
      type="button" class="siscap-form-nav-button siscap-form-nav-button-primary"
      id="voltarBtn"
      (click)="voltarParaAcoes()"
    >
      <i class="pi pi-arrow-left"></i>
    </button>
  </div>
</section>

<div [formGroup]="formProjeto" class="card">

    <div class="card-body">

        <!-- CABEÇALHO -->
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">

            <!-- TÍTULO + BOTÃO -->
            <div class="d-flex align-items-center gap-3">

                <div>
                    <span class="fw-semibold">
                        Ações
                    </span>

                    <span class="text-danger">*</span>
                </div>

                <button type="button" class="btn btn-sm btn-outline-primary" (click)="adicionarAcao()"
                    [disabled]="!isModoEdicao">
                    <i class="fa-solid fa-plus me-1"></i>
                    CRIAR AÇÃO
                </button>

            </div>


            <!-- SOMATÓRIO -->
            <div class="text-end">

                <div class="text-muted small">
                    Soma valor estimado das ações
                </div>

                <div class="fw-bold">
                    {{
                    valorTotalAcoes
                    | mask
                    : "separator.2"
                    : {
                    prefix: rateioService.simboloMoeda + " ",
                    leadZero: true,
                    thousandSeparator: ".",
                    decimalMarker: ","
                    }
                    }}
                </div>

            </div>

        </div>


        <hr class="mt-0 mb-4">


        <!-- FORM ARRAY DAS AÇÕES -->
        <div formArrayName="acoesProjeto">

            <div *ngFor="let acao of acoesProjeto.controls; let i = index" [formGroupName]="i" class="acao-container">

                <!-- CABEÇALHO DA AÇÃO -->
                <div class="d-flex justify-content-between align-items-center mb-3">

                    <span class="fw-semibold">
                        Ação #{{ i + 1 }}
                    </span>

                    <button *ngIf="isModoEdicao" type="button" class="btn btn-sm btn-outline-danger"
                        title="Excluir ação" (click)="removerAcao(i)">
                        <i class="fa-solid fa-trash"></i>
                    </button>

                </div>


                <!-- AÇÃO PRINCIPAL -->
                <div class="row">

                    <div class="col-12 mb-3">

                        <label [for]="'descricaoAcaoPrincipal-' + i" class="form-label">
                            Ação Principal
                            <span class="text-danger">*</span>
                        </label>

                        <input type="text" class="form-control" [id]="'descricaoAcaoPrincipal-' + i"
                            formControlName="descricaoAcaoPrincipal" />

                    </div>

                </div>


                <!-- VALOR ESTIMADO -->
                <div class="row">

                    <div class="col-12 col-md-4 mb-3">

                        <label [for]="'valorEstimadoAcaoPrincipal-' + i" class="form-label">
                            Valor Estimado
                            <span class="text-danger">*</span>
                        </label>

                        <!-- <input type="number" class="form-control" [id]="'valorEstimadoAcaoPrincipal-' + i"
                            formControlName="valorEstimadoAcaoPrincipal" /> -->
                        <input type="text" class="form-control" [id]="'valorEstimadoAcaoPrincipal-' + i"
                            formControlName="valorEstimadoAcaoPrincipal" mask="separator.2" prefix="R$ "
                            thousandSeparator="." decimalMarker="," [leadZero]="true" />

                    </div>

                </div>

                <!-- AÇÕES SECUNDÁRIAS -->
                <div class="row">

                    <div class="col-12 mb-3">

                        <label [for]="'descricaoAcaoSecundaria-' + i" class="form-label">
                            Descrição de ações secundárias e produtos
                            <span class="text-danger">*</span>
                        </label>

                        <textarea class="form-control" rows="3" [id]="'descricaoAcaoSecundaria-' + i"
                            formControlName="descricaoAcaoSecundaria"></textarea>

                    </div>

                </div>

                <!-- REGIÕES GEOGRÁFICAS / RATEIO -->
                <div class="row">

                    <div class="col-12">

                        <div class="d-flex justify-content-between align-items-center">

                            <label class="form-label mb-0">
                                Regiões Geográficas Atendidas
                                <span class="text-danger">*</span>
                            </label>

                            <button type="button" class="btn btn-sm btn-light" (click)="alternarRateio(i)"
                                [attr.aria-expanded]="rateioAberto(i)" title="Exibir distribuição por região">

                                <i class="fa-solid" [ngClass]="{
                    'fa-chevron-down': !rateioAberto(i),
                    'fa-chevron-up': rateioAberto(i)
                  }"></i>

                            </button>

                        </div>


                        <!-- RATEIO INICIALMENTE ESCONDIDO -->
                        <div *ngIf="rateioAberto(i)" class="mt-3">

                            <siscap-rateio-form [isModoEdicao]="isModoEdicao"></siscap-rateio-form>

                        </div>

                    </div>

                </div>


                <!-- SEPARADOR ENTRE AÇÕES -->
                <hr *ngIf="i < acoesProjeto.length - 1" class="my-4">

            </div>

        </div>

    </div>

</div>

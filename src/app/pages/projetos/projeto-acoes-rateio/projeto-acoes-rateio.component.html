<div [formGroup]="formProjeto" class="card siscap-indicator-panel acoes-panel">
    <div class="card-body">


        <div class="acoes-cabecalho">
            <div class="acoes-tabs-area">

                <button type="button" class="acao-tab acao-add-tab" title="Criar nova ação" aria-label="Criar nova ação"
                            (click)="adicionarAcao()" [disabled]="!isModoEdicao">

                            <i class="fa-solid fa-plus"></i>

                        </button>
<button type="button" class="acoes-scroll-arrow" *ngIf="exibirSetas && podeRolarEsquerda" aria-label="Ações anteriores" [disabled]="!podeRolarEsquerda" (click)="rolarAcoes(-1)"><i class="pi pi-chevron-left" aria-hidden="true"></i></button>
<ul class="nav nav-tabs" #acoesScroller siscapDragScroll (scroll)="atualizarNavegacao()">


                    <!-- ================================================= -->
                    <!-- ADICIONAR AÇÃO                                    -->
                    <!-- ================================================= -->




                    <!-- ================================================= -->
                    <!-- ABAS DAS AÇÕES                                    -->
                    <!-- ================================================= -->

                    <li class="nav-item acao-tab-item" *ngFor="
                            let acao of acoesProjeto.controls;
                            let i = index
                        ">

                        <div class="acao-tab-group" [class.active]="acaoAtivaIndex === i" [class.inactive]="acaoAtivaIndex !== i">


                            <!-- SELECIONAR AÇÃO -->
                            <button type="button" class="acao-tab acao-tab-select" [class.active]="acaoAtivaIndex === i" [attr.aria-pressed]="acaoAtivaIndex === i"
                                (click)="selecionarAcao(i)">

                                Ação #{{ i + 1 }}

                            </button>
                            <button *ngIf="isModoEdicao" type="button" class="acao-tab-delete"
                              [attr.aria-label]="'Excluir ação #' + (i + 1)" title="Excluir ação"
                              (click)="removerAcao(i)">
                              <i class="fa-solid fa-trash" aria-hidden="true"></i>
                            </button>

                        </div>

                    </li>


                </ul>
<button type="button" class="acoes-scroll-arrow" *ngIf="exibirSetas && podeRolarDireita" aria-label="Próximas ações" [disabled]="!podeRolarDireita" (click)="rolarAcoes(1)"><i class="pi pi-chevron-right" aria-hidden="true"></i></button>

            </div>
        <div class="acoes-resumo">
            <div class="acoes-resumo-label">Soma valor estimado das ações</div>
            <div class="acoes-resumo-valor">
                {{ valorTotalAcoes | mask : 'separator.2' : { prefix: rateioService.simboloMoeda + ' ', leadZero: true, thousandSeparator: '.', decimalMarker: ',' } }}
            </div>
        </div>
        </div>
        <div *ngIf="acoesProjeto.length === 0" class="siscap-empty-state">

            Nenhuma ação cadastrada.

        </div>


        <!-- ===================================================== -->
        <!-- FORM ARRAY DAS AÇÕES                                  -->
        <!-- ===================================================== -->

        <div *ngIf="acoesProjeto.length > 0" formArrayName="acoesRateioProjeto" class="acao-conteudo">

            <ng-container *ngFor="
                    let acao of acoesProjeto.controls;
                    let i = index
                ">

                <!-- ================================================= -->
                <!-- CONTEÚDO DA AÇÃO ATIVA                            -->
                <!-- ================================================= -->
                <div [class.d-none]="acaoAtivaIndex !== i" [formGroupName]="i" class="acao-container">

                    <!-- ================================================= -->
                    <!-- AÇÃO PRINCIPAL / VALOR ESTIMADO                   -->
                    <!-- ================================================= -->
                    <div class="row">
                        <div class="col-12 col-md-9 mb-3">
                            <label [for]="'descricaoAcaoPrincipal-' + i" class="siscap-field-label" >
                                Título
                                <form-helper-tooltip [texto]="projetoAcoesListTooltip['descricaoAcaoPrincipal']"></form-helper-tooltip>
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" [id]="'descricaoAcaoPrincipal-' + i"
                                formControlName="descricaoAcaoPrincipal" />
                        </div>

                         <div class="col-12 col-md-3 mb-3">
                            <label [for]=" 'valorEstimadoAcaoPrincipal-' + i" class="siscap-field-label d-block" >
                                Valor estimado
                                <form-helper-tooltip [texto]="projetoAcoesListTooltip['valorEstimadoAcaoPrincipal']"></form-helper-tooltip>
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control text-end" [id]="'valorEstimadoAcaoPrincipal-' + i"
                                formControlName="valorEstimadoAcaoPrincipal"
                                siscapCurrencyCaret mask="separator.2" prefix="R$ "
                                thousandSeparator="." decimalMarker=","
                                [inputTransformFn]="rtlCurrencyInputTransformFn"
                                [outputTransformFn]="rtlCurrencyOutputTransformFn"
                                inputmode="decimal" />
                        </div>

                    </div>

                    <!-- ================================================= -->
                    <!-- AÇÕES SECUNDÁRIAS                                 -->
                    <!-- ================================================= -->
                    <div class="row">
                        <div class="col-12 mb-3">
                            <label [for]="'descricaoAcaoSecundaria-' + i" class="siscap-field-label">
                                Descrição de ações secundárias e produtos
                                <form-helper-tooltip [texto]="projetoAcoesListTooltip['descricaoAcoesSecudariasProdutos']"></form-helper-tooltip>
                                <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control" rows="3" [id]="'descricaoAcaoSecundaria-' + i" formControlName="descricaoAcaoSecundaria"></textarea>
                        </div>
                    </div>

                    <!-- REGIÕES GEOGRÁFICAS / RATEIO -->
                    <div class="row">
                        <div class="col-12">

                            <!-- CONTAINER DO RATEIO -->
                            <div class="rateio-container rateio-container-aberto">

                                <!-- CONTEÚDO SEMPRE ABERTO -->
                                <div class="rateio-conteudo">
                                    <app-rateio-acao-localidade-form class="d-block w-100" [isModoEdicao]="isModoEdicao"
                                        [formAcao]="getAcaoRateioForm(i)"
                                        [localidadesOpcoes]="rateioService.localidadesOpcoes">
                                    </app-rateio-acao-localidade-form>
                                </div>

                            </div>

                        </div>
                    </div>

                </div>

            </ng-container>

        </div>

    </div>

</div>

<!-- ============================================================= -->
<!-- NAVEGAÇÃO ENTRE AS ABAS PRINCIPAIS                            -->
<!-- ============================================================= -->
<div class="siscap-form-navigation">

    <button type="button" class="siscap-form-nav-button siscap-form-nav-button-primary" (click)="voltarParaOds()">

        <i class="pi pi-arrow-left"></i>

    </button>

    <button type="button" class="siscap-form-nav-button siscap-form-nav-button-primary" (click)="irParaPlanejamento()">

        <i class="pi pi-arrow-right"></i>

    </button>

</div>

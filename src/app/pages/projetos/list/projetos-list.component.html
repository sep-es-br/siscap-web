<div class="table-responsive-md">
  <table class="table table-striped">
    <colgroup>
      <col class="sigla-col" />
      <col class="titulo-col" />
      <col class="rascunho-col" />
      <col class="status-col" />
      <col class="processoEdocs-col" />
      <col class="valorEstimado-col" />
      <col class="acoes-col" />
    </colgroup>
    <thead>
      <tr>
        <th [sortable]="'sigla'" (sort)="sortColumn($event)" class="pointer">
          Sigla
        </th>
        <th [sortable]="'titulo'" (sort)="sortColumn($event)" class="pointer">
          Título
        </th>
        <th></th>
        <th>Status</th>
        <th>Processo<br>E-Docs</th>
        <th>Valor<br>Estimado</th>
        <th></th>
      </tr>
    </thead>
    <tbody class="fw-semibold">
      <tr *ngFor="let projeto of projetosList()" (click)="editarProjeto(projeto.id)">
        <td>{{ projeto.sigla }}</td>
        <td>{{ projeto.titulo }}</td>
        <td>
        </td>
        <td>{{ projeto.status }}</td>
        <td style="white-space: nowrap; word-break: keep-all;">
          <a *ngIf="projeto.protocoloEdocs" [href]="urlEdocsBase + projeto.protocoloEdocs" target="_blank"
            rel="noopener noreferrer">
            {{ projeto.protocoloEdocs }}
          </a>
          <span class="badge rounded-pill text-bg-warning d-inline-flex align-items-center gap-1"
            *ngIf="projetosAguardando.has(projeto.id)">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Aguardando E-Docs</span>
        </td>
        <td style="text-align: right; white-space: nowrap; ">
          {{
          projeto.valorEstimado
          | mask
          : "separator.2"
          : {
          prefix: "R$ ",
          leadZero: true,
          thousandSeparator: ".",
          decimalMarker: ","
          }
          }}
        </td>
        <td (click)="podeDeletarDic(projeto.id) ? $event.stopPropagation() : undefined">
          <button class="btn border-none" (click)="deletarProjeto(projeto.id)" [disabled]="!podeDeletarDic(projeto.id)"
            title="Excluir">
            <i class="fa-solid fa-trash-can me-2"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-content select="siscap-pagination"></ng-content>
</div>

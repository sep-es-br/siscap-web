<siscap-table minWidth="72rem" [rows]="projetosList()" [columns]="colunas" [rowClickable]="true" [fixedLayout]="true" [rowKey]="identificarLinha" [caption]="MENSAGENS.DIC" (rowClick)="editarProjeto($event.id)" (sortChange)="sortColumn($event)">

  <ng-template siscapTableCell="criadoEm" let-projeto>
    {{ projeto.dataCriacaoDic | date:'dd/MM/yyyy' }}
  </ng-template>

  <ng-template siscapTableCell="edocs" let-projeto>
    <a *ngIf="projeto.protocoloEdocs" [href]="urlEdocsBase + projeto.protocoloEdocs" target="_blank"  rel="noopener noreferrer">
            {{ projeto.protocoloEdocs }}
          </a>
          <span class="badge rounded-pill text-bg-warning d-inline-flex align-items-center gap-1" *ngIf="projetosAguardando.has(projeto.id)">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            {{ MENSAGENS.AGUARDANDO_E_DOCS }}</span>
  </ng-template>

  <ng-template siscapTableCell="valor" let-projeto>
    {{
          projeto.valorEstimado
          | mask
          : "separator.2"
          : {
          prefix: "R$ ",
          leadZero: true,
          thousandSeparator: ".",
          decimalMarker: ","
          }
          }}
  </ng-template>

  <ng-template siscapTableCell="acoes" let-projeto>
    <button type="button" class="btn-excluir" (click)="deletarProjeto(projeto.id)" [hidden]="!podeDeletarDic(projeto.id)" [disabled]="!podeDeletarDic(projeto.id)"  title="{{ MENSAGENS.EXCLUIR }}">
            <i class="fa-solid fa-trash-can siscap-table-icon-delete"></i>
          </button>
  </ng-template>
  <div tablePagination>
    <ng-content select="siscap-pagination"></ng-content>
  </div>
</siscap-table>

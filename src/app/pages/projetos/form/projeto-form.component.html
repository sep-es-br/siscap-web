<div class="h-100" *ngIf="loading || isLoadingPessoas">
  <loading-spinner></loading-spinner>
</div>

<div class="row" *ngIf="!loading">
  <div class="mb-2 d-inline-flex justify-content-end">
    <button
      *ngIf="mostrarBotaoStatusProjeto"
      class="btn btn-outline-success icon-text-btn me-2"
      (click)="abrirModalStatusProjeto(projetoStatusModal)"
    >
      <i class="fa-solid fa-check"></i>
      <span>Status</span>
    </button>
    <button
      *ngIf="mostrarBotaoGerarDic"
      class="btn btn-outline-primary icon-text-btn"
      (click)="baixarDIC()"
    >
      <i class="fa-solid fa-file-arrow-down"></i>
      <span>Gerar DIC</span>
    </button>
  </div>
</div>

<div class="project-form" *ngIf="!loading">
  <div class="card">
    <div class="card-body">
      <form [formGroup]="projetoForm">
        <div class="row gy-2">
          <div class="col-12 col-md-3 mb-2 mb-md-0">
            <label for="sigla" class="form-label col-12">
              <validation-message [control]="getControl('sigla')">
                Sigla do Projeto
                <form-helper-tooltip
                  [texto]="projetoTooltip['sigla']"
                ></form-helper-tooltip>
              </validation-message>
            </label>
            <input
              mask=""
              [inputTransformFn]="toUppercaseInputTransformFn"
              [outputTransformFn]="toUppercaseOutputTransformFn"
              type="text"
              class="form-control"
              id="sigla"
              formControlName="sigla"
              maxlength="12"
            />
          </div>

          <div class="col-12 col-md-9">
            <label for="titulo" class="form-label col-12">
              <validation-message [control]="getControl('titulo')">
                Titulo do Projeto
                <form-helper-tooltip
                  [texto]="projetoTooltip['titulo']"
                ></form-helper-tooltip>
              </validation-message>
            </label>
            <input
              type="text"
              class="form-control"
              id="titulo"
              formControlName="titulo"
              maxLength="150"
            />
          </div>

          <div class="col-12 col-md-6" id="orgao">
            <label for="idOrganizacao" class="form-label col-12">
              <validation-message [control]="getControl('idOrganizacao')">
                Orgão de Origem
                <form-helper-tooltip
                  [texto]="projetoTooltip['idOrganizacao']"
                ></form-helper-tooltip>
              </validation-message>
            </label>
            <ng-select
              id="idOrganizacao"
              placeholder="-- Selecione um orgão da lista abaixo --"
              formControlName="idOrganizacao">
            >
              <ng-option
                *ngFor="let organizacao of organizacoesOpcoes"
                [value]="organizacao.id"
                >{{ organizacao.nome }}</ng-option
              >
            </ng-select>
          </div>

          <div class="col-12 col-md-6" id="responsavel-proponente">
            <label for="responsavelProponente" class="form-label col-12">
              <validation-message
                [control]="getControl('idResponsavelProponente')">
                Responsavel Proponente
                <form-helper-tooltip
                  [texto]="projetoTooltip['idResponsavelProponente']"
                ></form-helper-tooltip>
              </validation-message>
            </label>
            <ng-container *ngIf="!isLoadingPessoas; else carregandoResponsaveis">
              <ng-select
                id="responsavelProponente"
                placeholder="-- Selecione o responsável proponente --"
                formControlName="subResponsavelProponente"
                [items]="pessoasOpcoes"
                bindLabel="nome"
                bindValue="agentePublicoSub" 
                [clearable]="true"
                (change)="onSelecionarPessoa($event)" > 
                <ng-template ng-option-tmp let-item="item">
                  <div style="display: flex; flex-direction: column; line-height: 1.2;">
                    <span>{{ item.nome }}</span>
                    <span style="font-size: 0.65em; color: gray;">{{ item.papelPrioritario }}</span>
                  </div>
                </ng-template>
              </ng-select>
            </ng-container>
            <ng-template #carregandoResponsaveis>
              <p>Carregando responsáveis...</p>
            </ng-template>
          </div>

          <div class="col-12">
            <label for="membroEquipeElaboracao" class="form-label col-12">
              <validation-message [control]="getControl('equipeElaboracao')">
                Equipe de Elaboração
                <form-helper-tooltip
                  [texto]="projetoTooltip['equipeElaboracao']"
                ></form-helper-tooltip>
              </validation-message>
            </label>
            <ng-select
              id="idMembroEquipeElaboracao"
              placeholder="-- Selecione uma pessoa para incluir na equipe de elaboração --"
              [(ngModel)]="idMembroEquipeElaboracao"
              [items]="pessoas$ | async"
              [ngModelOptions]="{ standalone: true }">
              <ng-option
                *ngFor="let pessoa of pessoasOpcoesGoves"
                [value]="pessoa.agentePublicoSub">
                {{ pessoa.nome }}
              </ng-option>
            </ng-select>
          </div>

          <div class="col-12 mt-2">
            <siscap-equipe-form
              [pessoasOpcoes]="pessoasOpcoes"
              [tiposPapelOpcoes]="tiposPapelOpcoesVisiveis"
              [isModoEdicao]="isModoEdicao"
            ></siscap-equipe-form>
          </div>
          <div class="col-12">
            <siscap-valor-form
              [moedasList]="moedasList"
              [tiposValorOpcoes]="tiposValorOpcoes"
            ></siscap-valor-form>
          </div>

          <div class="col-12 mt-2">
            <label for="membroIndicadorElaboracao" class="form-label col-12">
              Indicadores
              <form-helper-tooltip
                [texto]="projetoTooltip['nomeIndicador']"
              ></form-helper-tooltip>
            </label>
            <siscap-indicadores-form
              [isModoEdicao] = "isModoEdicao" >
            </siscap-indicadores-form>
          </div>

          <div class="col-12 mt-2" >
            <label for="rateio" class="form-label col-12">
              <validation-message [control]="getControl('rateio')">
                Regiões Geográficas Atendidas
              </validation-message>
            </label>
            <siscap-rateio-form
              [isModoEdicao]="isModoEdicao"
            ></siscap-rateio-form>
          </div>

          <div class="col-12">
            <label for="rateio" class="form-label col-12">
                Ações
            </label>
            <siscap-acoes-form 
              [isModoEdicao]="isModoEdicao">
            </siscap-acoes-form>
          </div>

          <div class="col-12" >
            <label for="microrregioesAtendidas" class="col-12 form-label">
              <validation-message [control]="getControl('idMicrorregioesList')">
                Microrregiões Atendidas
                <form-helper-tooltip
                  [texto]="projetoTooltip['idMicrorregioesList']"
                ></form-helper-tooltip>
              </validation-message>
            </label>
            <ng-select
              id="microrregioesAtendidas"
              placeholder="-- Selecione uma ou mais microrregiões --"
              formControlName="idMicrorregioesList"
              [multiple]="true"
              (add)="microrregioesNgSelectAddEvent($event)"
            >
              <ng-option
                *ngFor="let microrregiao of microrregioesOpcoes"
                [value]="microrregiao.id"
                [disabled]="travarMicrorregiaoOpcao(microrregiao.id)"
                >{{ microrregiao.nome }}</ng-option
              >
            </ng-select>
          </div>

          <div class="col-12">
            <label for="objetivo" class="form-label col-12">
              <validation-message [control]="getControl('objetivo')">
                Objetivo
                <form-helper-tooltip
                  [texto]="projetoTooltip['objetivo']"
                ></form-helper-tooltip>
              </validation-message>
            </label>
            <textarea
              rows="5"
              class="form-control"
              id="objetivo"
              formControlName="objetivo"
              maxLength="2000"
            ></textarea>
          </div>

          <div class="col-12">
            <label for="objetivoEspecifico" class="form-label col-12">
              <validation-message [control]="getControl('objetivoEspecifico')">
                Objetivo Específico
                <form-helper-tooltip
                  [texto]="projetoTooltip['objetivoEspecifico']"
                ></form-helper-tooltip>
              </validation-message>
            </label>
            <textarea
              rows="5"
              class="form-control"
              id="objetivoEspecifico"
              formControlName="objetivoEspecifico"
              maxLength="2000"
            ></textarea>
          </div>

          <div class="col-12">
            <label for="situacaoProblema" class="form-label col-12">
              <validation-message [control]="getControl('situacaoProblema')">
                Situação Problema
                <form-helper-tooltip
                  [texto]="projetoTooltip['situacaoProblema']"
                ></form-helper-tooltip>
              </validation-message>
            </label>

            <textarea
              rows="5"
              class="form-control"
              id="situacaoProblema"
              formControlName="situacaoProblema"
              maxLength="2000"
            ></textarea>
          </div>

          <div class="col-12">
            <label for="solucoesPropostas" class="form-label col-12">
              <validation-message [control]="getControl('solucoesPropostas')">
                Soluções Propostas/Resultados Esperados
                <form-helper-tooltip
                  [texto]="projetoTooltip['solucoesPropostas']"
                ></form-helper-tooltip>
              </validation-message>
            </label>
            <textarea
              rows="5"
              class="form-control"
              id="solucoesPropostas"
              formControlName="solucoesPropostas"
              maxLength="2000"
            ></textarea>
          </div>

          <div class="col-12">
            <label for="impactos" class="form-label col-12">
              <validation-message [control]="getControl('impactos')">
                Impactos do Projeto no Âmbito Ambiental, Social e de Governança
                (ESG)
                <form-helper-tooltip
                  [texto]="projetoTooltip['impactos']"
                ></form-helper-tooltip>
              </validation-message>
            </label>
            <textarea
              rows="5"
              class="form-control"
              id="impactos"
              formControlName="impactos"
              maxLength="2000"
            ></textarea>
          </div>

          <div class="col-12">
            <label for="arranjosInstitucionais" class="form-label col-12">
              <validation-message
                [control]="getControl('arranjosInstitucionais')"
              >
                Arranjo Institucional
                <form-helper-tooltip
                  [texto]="projetoTooltip['arranjosInstitucionais']"
                ></form-helper-tooltip>
              </validation-message>
            </label>
            <textarea
              rows="5"
              class="form-control"
              id="arranjosInstitucionais"
              formControlName="arranjosInstitucionais"
              maxLength="2000"
            ></textarea>
          </div>

        </div>
      </form>
    </div>
  </div>
</div>

<ng-template #projetoStatusModal let-modal>
  <div class="modal-body">
    <p>Status do Projeto: {{ statusProjeto }}</p>

    <label for="status-projeto">Novo Status</label>
    <ng-select
      id="status-projeto"
      name="status-projeto"
      [clearable]="false"
      [(ngModel)]="statusProjetoNovo"
    >
      <ng-option
        *ngFor="let statusProjetoOpcao of statusProjetoOpcoes"
        [value]="statusProjetoOpcao"
      >
        {{ statusProjetoOpcao }}
      </ng-option>
    </ng-select>
  </div>
  <div class="modal-footer">
    <div class="d-inline-flex flex-row-reverse">
      <button
        class="btn btn-success icon-text-btn"
        [disabled]="statusProjetoNovo == null"
        (click)="modal.close(statusProjetoNovo)"
      >
        <i class="fa-solid fa-check"></i>
        <span>Alterar</span>
      </button>
      <button
        class="btn btn-outline-primary icon-text-btn me-2"
        (click)="modal.dismiss()"
      >
        <i class="fa-solid fa-arrow-turn-up fa-rotate-270"></i>
        <span>Voltar</span>
      </button>
    </div>
  </div>
</ng-template>

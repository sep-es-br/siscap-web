<section id="header-content" class="w-100 top-0 start-0" style="z-index: 20">
  <siscap-header></siscap-header>

  <siscap-breadcrumb></siscap-breadcrumb>
</section>

<div class="container-fluid gx-0">
  <section
    id="main-content"
    [ngClass]="{
      'main-content-wrapper': !isProponente,
      'main-content-wrapper-proponente': isProponente
    }"
  >
    <div class="row gx-0">
      <div class="col-10 col-xl-8 mx-auto">
        <router-outlet></router-outlet>
      </div>
    </div>
    <div class="footer d-flex justify-content-center text-center">
      <span class="text-secondary align-content-center">
        {{ formatarMensagem(MENSAGENS.SISCAP_VALOR_SECRETARIA_DE_ECONOMIA_E_PLANEJAMENTO_DO_ESPIRITO_SANTO, { p0: (currentYear) }) }}</span
      >
    </div>
  </section>
</div>

<siscap-toast></siscap-toast>

<section id="header-content" class="w-100 position-fixed top-0 start-0 z-3">
  <siscap-header></siscap-header>

  <siscap-breadcrumb></siscap-breadcrumb>
</section>

<div class="container-fluid vh-100 gx-0">
  <section
    id="main-content"
    [ngClass]="{
      'main-content-wrapper': !isProponente,
      'main-content-wrapper-proponente': isProponente
    }"
  >
    <div class="row gx-0">
      <div class="col-10 col-xl-8 mx-auto">
        <router-outlet></router-outlet>
      </div>
    </div>
    <div class="footer d-flex justify-content-center text-center">
      <span class="text-secondary align-content-center">
        SISCAP 2024 - Secretaria de Economia e Planejamento do Espírito
        Santo</span
      >
    </div>
  </section>
</div>

<siscap-toast></siscap-toast>

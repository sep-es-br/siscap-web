<siscap-modal [titulo]="MENSAGENS.CRIAR_UM_INDICADOR_DE_PROJETO" tituloId="indicador-projeto-modal-title" (fecharModal)="fechar()">
    <form modalBody [formGroup]="formIndicador">

        <div class="filter-scroll">

            <div class="form-row"><label><validation-message [exibirErros]="false" [control]="getControl('nomeIndicador')">{{ MENSAGENS.NOME_DO_INDICADOR }}
                    </validation-message></label><input class="form-control" type="text" formControlName="nomeIndicador" id="fName"
                    placeholder="{{ MENSAGENS.EX_TAXA_DE_ALFABETIZACAO }}" maxlength="200"><validation-message class="field-error" alinhamento="esquerda" [exibirObrigatorio]="false" [control]="getControl('nomeIndicador')"></validation-message></div>

            <div class="form-row"><label><validation-message [exibirErros]="false" [control]="getControl('formulaCalculo')">{{ MENSAGENS.FORMULA_METODOLOGIA_DE_CALCULO }}
                    </validation-message></label>
                <textarea class="form-control" formControlName="formulaCalculo" id="fFormula" rows="3"
                    placeholder="{{ MENSAGENS.DESCREVE_A_FORMULA_OU_METODOLOGIA }}" maxlength="2000">
                </textarea><validation-message class="field-error" alinhamento="esquerda" [exibirObrigatorio]="false" [control]="getControl('formulaCalculo')"></validation-message>
            </div>

            <div class="form-row"><label><validation-message [exibirErros]="false"
                        [control]="getControl('medidoPor')">{{ MENSAGENS.FONTE }}</validation-message></label><input class="form-control" type="text"
                    formControlName="medidoPor" id="fOrgao" placeholder="{{ MENSAGENS.EX_SECRETARIA_DE_EDUCACAO }}" maxlength="50"><validation-message class="field-error" alinhamento="esquerda" [exibirObrigatorio]="false" [control]="getControl('medidoPor')"></validation-message>
            </div>

            <div class="indicator-reference-grid">
                <div class="form-row"><label><validation-message [exibirErros]="false" [control]="getControl('unidadeMedida')">{{ MENSAGENS.UNIDADE_DE_MEDIDA }}</validation-message></label><input class="form-control" type="text" formControlName="unidadeMedida"
                        id="fUnidade" placeholder="{{ MENSAGENS.EX }}" maxlength="50"><validation-message class="field-error" alinhamento="esquerda" [exibirObrigatorio]="false" [control]="getControl('unidadeMedida')"></validation-message></div>
                <div class="form-row"><label><validation-message [exibirErros]="false" [control]="getControl('basedeReferencia')">{{ MENSAGENS.BASE_DE_REFERENCIA }}</validation-message></label><input class="form-control" type="text" formControlName="basedeReferencia"
                        id="fValorBase" placeholder="{{ MENSAGENS.EX_25_000_2022 }}" maxlength="30"><validation-message class="field-error" alinhamento="esquerda" [exibirObrigatorio]="false" [control]="getControl('basedeReferencia')"></validation-message></div>
            </div>

            <div class="form-row"><label>{{ MENSAGENS.META_DO_PROJETO }}</label>
                <div formArrayName="metasIndicadorProjeto">
                    <div class="meta-years">
                        <div class="year-meta"
                            *ngFor="let meta of getMetasProjeto().controls; let i = index"
                            [formGroupName]="i">
                            <div class="year-label">
                                <validation-message [exibirErros]="false" [control]="getMetaProjetoControl(i)"> {{ meta.get('anoMeta')?.value }}
                                </validation-message>
                            </div>
                            <input class="form-control year-value-input" type="text" pInputText inputmode="text" formControlName="valorMeta" maxlength="20"
                                /><validation-message class="field-error" alinhamento="esquerda" [exibirObrigatorio]="false" [control]="getMetaProjetoControl(i)"></validation-message>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </form>

    <div modalFooter class="form-actions">
        <siscap-botao [propriedades]="botaoCancelar" (acao)="fechar()"></siscap-botao>
        <siscap-botao [propriedades]="botaoAdicionar" (acao)="salvar()"></siscap-botao>
    </div>
</siscap-modal>

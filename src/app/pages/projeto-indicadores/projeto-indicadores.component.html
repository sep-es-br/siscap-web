<!-- CARD: FILTROS -->
<siscap-filter-card [chips]="chips" [groupByField]="true" [disabled]="!isModoEdicao" [loading]="loading"
  (openFilter)="showModal = true" (chipRemove)="removeChip($event)">
</siscap-filter-card>

<app-filtro-indicadores *ngIf="showModal" [gestao]="gestao" [desafios]="gestao?.desafios || []"
  [filtroAtual]="currentFilter" (apply)="onApply($event)" (close)="showModal = false" (restaurar)="onRestaurar()"
  [somenteLeitura]="!isModoEdicao"></app-filtro-indicadores>

<app-selecao-indicadores [indicadores]="indicadoresBI" [gestao]="gestao" [form]="formProjeto"
  [selecionados]="indicadoresSelecionados" [loading]="loading" (selecionadosChange)="onSelecaoChange($event)"
  [podeEditar]="isModoEdicao">
</app-selecao-indicadores>

<!-- CARD: INDICADORES SELECIONADOS -->
<div class="card siscap-indicator-panel">

  <div class="card-selecionados">

    <p class="siscap-indicator-heading">
      <validation-message [control]="getControl('indicadoresProjeto')">
        {{ MENSAGENS.INDICADORES_SELECIONADOS }}
      </validation-message>
    </p>
    <p class="siscap-empty-state" *ngIf="indicadoresSelecionados.length === 0 && getIndicadoresAvulsos().length === 0">{{ MENSAGENS.NENHUM_INDICADOR_SELECIONADO }}</p>

    <div id="indicatorsContainer">
      <div class="indicador-selecionado"
        *ngFor="let item of indicadoresSelecionados; let i = index; trackBy: trackByIndicador">
        <siscap-indicador-card [indicador]="dadosCardCatalogo(item)"
          [metasReferencia]="getMetasIndicadorBi(i)" [metasProjeto]="getMetas(i)"
          [idPrefixo]="'meta-catalogo-' + i" [podeRemover]="isModoEdicao"
          (remover)="removeIndicator(item, false)">
        </siscap-indicador-card>
      </div>
      <div class="indicador-selecionado"
        *ngFor="let item of getIndicadoresAvulsos().controls; let i = index">
        <siscap-indicador-card [indicador]="dadosCardProjeto(item)"
          [metasProjeto]="getMetasIndicadorAvulsoProjeto(i)" [idPrefixo]="'meta-avulso-' + i"
          [podeRemover]="!somenteLeitura" [rotuloRemover]="MENSAGENS.REMOVER_INDICADOR_DE_PROJETO"
          (remover)="removeIndicadorAvulsoProjeto(i)">
        </siscap-indicador-card>
      </div>
    </div>
  </div>
</div>

<div class="siscap-form-navigation">
  <button class="siscap-form-nav-button siscap-form-nav-button-primary" id="voltarBtn"
    (click)="voltarParaDic()"><i class="pi pi-arrow-left"></i></button>
  <button class="siscap-form-nav-button siscap-form-nav-button-primary" id="avancarBtn"
    (click)="irParaODS()"><i class="pi pi-arrow-right"></i></button>
</div>

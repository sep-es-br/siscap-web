<siscap-filter-modal
    ariaLabel="Filtros de indicadores"
    [restoreDisabled]="somenteLeitura"
    [applyDisabled]="somenteLeitura"
    (closeModal)="fechar()"
    (restore)="resetar()"
    (applyFilter)="applyFilter()">

    <div class="filter-grid row g-3">

            <!-- GESTÃO (linha inteira) -->
            <div class="filter-field col-12 col-sm-6 col-xl-3">
                <label class="filter-label">Gestão Administrativa</label>
                <select class="filter-select" [(ngModel)]="filtro.idGestao">
                    <option *ngIf="gestao" [value]="gestao.idGestao">
                        {{ gestao.nomeGestao }}
                    </option>
                </select>
            </div>

            <!-- LABELS DINÂMICOS -->
            <ng-container *ngFor="let label of labelsOrdenados; trackBy: trackByLabel">
                <div class="filter-field col-12 col-sm-6 col-xl-3">
                    <label class="filter-label">{{ label.nome }}</label>

                    <ng-select [items]="label.valores"
                        bindLabel="valor"
                        bindValue="idLabelValor"
                        [(ngModel)]="filtro.labels[label.idLabel]"
                        [multiple]="true"
                        [closeOnSelect]="false"
                        [searchable]="false"
                        [clearable]="true"
                        placeholder="Selecionar..."
                        class="select-filtro"
                        [disabled]="somenteLeitura || isLabelFilhoDisabled(label)"
                        (change)="onValorLabelChange( label, $event )"
                        >

                        <ng-template ng-multi-label-tmp>
                            <span class="custom-selected-label">
                                {{ getTextoSelecionadosLabel(label.idLabel) }}
                            </span>
                        </ng-template>

                        <ng-template ng-option-tmp let-item="item" let-item$="item$">
                            <div class="select-option-checkbox">
                                <input type="checkbox" [checked]="item$.selected" tabindex="-1"
                                    style="margin-right: 8px; pointer-events: none;" />
                                <span>{{ item.valor }}</span>
                            </div>
                        </ng-template>

                    </ng-select>

                </div>
            </ng-container>

            <!-- DESAFIOS -->
            <div class="filter-field col-12 col-sm-6 col-xl-3">
                <label class="filter-label">
                    Desafios
                </label>
                <ng-select [items]="listaDesafiosFiltrados" 
                    bindLabel="nome" 
                    bindValue="id" 
                    [(ngModel)]="filtro.desafio.id"
                    [multiple]="true" 
                    [closeOnSelect]="false" 
                    [searchable]="false"
                    [clearable]="true"
                    placeholder="Selecionar..." 
                    class="select-filtro" 
                    [disabled]="somenteLeitura || !isLabelsFilhosSelecionados()">

                    <ng-template ng-option-tmp let-item="item" let-item$="item$">
                        <input type="checkbox" [checked]="item$.selected" tabindex="-1" style="margin-right: 8px; pointer-events: none;" />
                        <span>{{ item.nome }}</span>
                    </ng-template>

                    <ng-template ng-multi-label-tmp let-items="items">
                        <span class="custom-selected-label" *ngIf="items.length === 1">
                            {{ items[0].nome }}
                        </span>
                        <span class="custom-selected-label" *ngIf="items.length > 1">
                            {{ items.length }} selecionados
                        </span>
                    </ng-template>

                </ng-select>
            </div>

    </div>

</siscap-filter-modal>

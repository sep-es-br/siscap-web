<div 
  class="gestao-badge" 
  [class.removable]="removable"
  (click)="handleClick()">
  <div class="chip-content">
    <span class="gestao-label">{{ label }}</span>
    <span class="gestao-year">{{ value }}</span>
  </div>
  <i *ngIf="removable" class="pi pi-times remove-icon" (click)="handleRemove($event)"></i>
</div>

<div class="card selection-card siscap-indicator-panel">

  <div class="card-header-main">
    <p class="siscap-indicator-heading">
      {{ MENSAGENS.SELECIONE_O_INDICADOR_ESTRATEGICO }}
      <form-helper-tooltip [texto]="indicadorTooltip['indicador']"></form-helper-tooltip>
    </p>
    <div class="search-container" [class.expanded]="searchVisible">
      <span class="p-input-icon-left p-input-icon-right w-100">
        <i class="pi pi-search search-icon cursor-pointer" (click)="toggleSearch()"></i>
        <input #searchInput [style.display]="searchVisible ? 'block' : 'none'" pInputText type="text"
          class="w-100 search-input" placeholder="{{ MENSAGENS.NOME_DO_INDICADOR_2 }}" [(ngModel)]="filtroTexto"
          (ngModelChange)="filtrarIndicadores()" [disabled]="!podeEditar" />
        <i class="pi pi-times clear-icon cursor-pointer" *ngIf="filtroTexto && searchVisible" (click)="limparBusca()"></i>
      </span>
    </div>
  </div>

  <div class="card-body indicador-lista">

    <div class="indicador-item select-all">
      <label class="indicador-label">
        <p-checkbox [binary]="true" [(ngModel)]="selectAll" (onChange)="toggleSelectAll($event)"
          [disabled]="!podeEditar"></p-checkbox>
        <span class="select-all-label">{{ MENSAGENS.SELECIONAR_TODOS }}</span>
      </label>
    </div>

    <ng-container *ngIf="!loading; else loadingTpl">
      <ng-container *ngIf="indicadoresFiltrados.length > 0; else vazio">
        <div class="indicador-item" *ngFor="let indicador of indicadoresFiltrados">
          <label *ngIf="!indicador.avulso" class="indicador-label">
            <p-checkbox [binary]="true" [ngModel]="isSelecionado(indicador)"
              (ngModelChange)="toggleIndicador(indicador)" [ngModelOptions]="{ standalone: true }"
              [disabled]="!podeEditar">
            </p-checkbox>
            <span>{{ indicador.nomeIndicador }} <small *ngIf="indicador.avulso" class="indicador-avulso-label">
                {{ MENSAGENS.INDICADOR_DE_PROJETO_2 }}</small> </span>
          </label>
        </div>
      </ng-container>
    </ng-container>

  </div>

  <div class="card-footer-selection">
    <button type="button" class="create-special-link" [disabled]="!podeEditar"
      title="{{ MENSAGENS.SE_NAO_ENCONTRAR_O_INDICADOR_ESTRATEGICO_DESEJADO_CRIE_UM_NOVO }}"
      (click)="podeEditar && showNewIndicatorForm(); $event.stopPropagation()"
     >
      <span class="create-special-link-label">{{ MENSAGENS.CRIAR_UM_INDICADOR_DE_PROJETO_2 }}</span>
    </button>
  </div>


</div>

<ng-template #loadingTpl>
  <div class="estado-vazio">
    <i class="pi pi-spin pi-spinner"></i>
    {{ MENSAGENS.CARREGANDO_INDICADORES }}
  </div>
</ng-template>

<ng-template #vazio>
  <div class="estado-vazio">
    <i class="pi pi-inbox"></i>
    {{ MENSAGENS.NENHUM_INDICADOR_ENCONTRADO }}
  </div>
</ng-template>

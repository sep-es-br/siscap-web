<div class="row">
  <div class="col-xl-7 col-lg-8 col-12">
    <div class="d-flex flex-wrap gap-3">
      <div class="card col-md-5 col-12">
        <div class="card-body d-flex">
          <div class="p-3">
            <i class="fa-solid fa-file-invoice fs-1"></i>
          </div>
        </div>
        <div class="card-footer">
          <div class="px-3 pb-3">
            <div class="dashboard-info">
              {{ projetosQuantidade }}
            </div>
            <span class="fw-medium"> Projetos </span>
          </div>
        </div>
      </div>

      <div class="card col-md-5 col-12">
        <div class="card-body">
          <div class="p-3">
            <i class="fa-solid fa-coins fs-1"></i>
          </div>
        </div>
        <div class="card-footer">
          <div class="px-3 pb-3">
            <div class="dashboard-info">
              {{ projetosValorEstimadoTotal }}
            </div>
            <span class="fw-medium"> Valor Estimado Total </span>
          </div>
        </div>
      </div>

      <div class="card col-md-5 col-12">
        <div class="card-body">
          <div class="p-3">
            <i class="fa-solid fa-briefcase fs-1"></i>
          </div>
        </div>
        <div class="card-footer">
          <div class="px-3 pb-3">
            <div class="dashboard-info">
              {{ programasQuantidade }}
            </div>
            <span class="fw-medium"> Programas </span>
          </div>
        </div>
      </div>

      <div class="card col-md-5 col-12">
        <div class="card-body">
          <div class="p-3">
            <i class="fa-solid fa-envelope-open-text fs-1"></i>
          </div>
        </div>
        <div class="card-footer">
          <div class="px-3 pb-3">
            <div class="dashboard-info">
              {{ cartasConsultaQuantidade }}
            </div>
            <span class="fw-medium"> Pesquisa de Fontes de Financiamento </span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-4"></div>
</div>

<div class="toast-container">
  <ng-container *ngFor="let toast of toastService.toastList">
    <ngb-toast class="app-toast" [delay]="toast.delay || 6000" [ngClass]="bgStyleMap[toast.type]"
      (hidden)="toastService.removeToast(toast)">
      <div class="toast-header-line">
        <p class="toast-title fw-bold">{{ toast.title }}</p>

        <button class="btn-close ms-auto" (click)="toastService.removeToast(toast)"></button>
      </div>

      <ng-container *ngFor="let message of toast.content">
        <p class="toast-message">{{ message }}</p>
      </ng-container>
    </ngb-toast>
  </ng-container>
</div>

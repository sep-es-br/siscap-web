<quill-editor
  [formControl]="controle"
  [readOnly]="!isModoEdicao"
  (onEditorCreated)="editorCriado($event)"
></quill-editor>

<ng-container
  *ngFor="let item of toolbarTooltips"
>
  <button
    type="button"
    class="d-none"
    [siscapToolbarTooltip]="item.text"
    [tooltipTarget]="item.target"
    tooltipPosition="top"
  ></button>
</ng-container>

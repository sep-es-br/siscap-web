<div
  class="bg-light pb-4"
  [ngClass]="{
    'breadcrumb-wrapper': !isProponente,
    'breadcrumb-wrapper-proponente': isProponente
  }"
>
  <div
    class="col-10 col-xl-8 mx-auto d-flex flex-column flex-md-row
           justify-content-between align-items-md-start gap-2"
  >

    <!-- Título + breadcrumb -->
    <div
      id="current-page-title-breadcrumb"
      class="col-12 col-md mb-2 mb-md-0"
    >
      <h1 class="current-page-title mb-0 text-truncate">
        {{ paginaAtual.titulo }}
      </h1>

      <nav [ngClass]="{ invisible: isProponente }">
        <ol class="breadcrumb fw-semibold mb-0">
          <ng-container *ngFor="let itemBreadcrumb of itemsBreadcrumb">
            <li class="breadcrumb-item">
              <a
                [routerLink]="[itemBreadcrumb.caminho]"
                class="breadcrumb-link text-decoration-none text-black"
                [ngClass]="{
                  active: itemBreadcrumb == paginaAtual,
                  'pe-none': loadingService.isProcessando$ | async
                }"
              >
                {{ itemBreadcrumb.titulo }}
              </a>
            </li>
          </ng-container>
        </ol>
      </nav>
    </div>

    <!-- Botões -->
    <div
      id="action-buttons"
      class="col-12 col-md-auto
             d-flex flex-column-reverse flex-md-row-reverse
             justify-content-end gap-1"
    >
      <ng-container *ngFor="let propriedades of botoesAcaoPropriedades">
        <div class="col-12 col-sm-auto">
          <siscap-botao
            [propriedades]="propriedades"
            (acao)="emitirAcaoBreadcrumb($event)"
          ></siscap-botao>
        </div>
      </ng-container>
    </div>

  </div>
</div>

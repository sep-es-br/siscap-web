<div class="col-12" >
  <div class="card mb-3">
    <div class="card-body">
        <ng-container *ngFor="let indicadorFormGroup of indicadoresService.indicadoresFormArray.controls; index as i">
          <form [formGroup]="indicadorFormGroup" >
            <div *ngIf="isIndicadorAtivo(i)" class="card mb-2" >
              <div class="card-body row align-items-start">
                <div class="col-md-4 mb-2 mb-md-0">
                  <label for="tipoIndicador" class="form-label">
                    <validation-message [control]="getControl('tipoIndicador')">
                      Tipo do indicador
                      <form-helper-tooltip 
                        [texto]="projetoTooltip['tipoIndicadorDescricao']"> 
                      </form-helper-tooltip>
                    </validation-message>
                  </label>
                  <textarea
                    class="form-control"
                    formControlName="tipoIndicador"
                    rows="4"
                    maxlength="80"
                  ></textarea>
                </div>
                <div class="col-md-4 mb-2 mb-md-0">
                  <label for="descricaoIndicador" class="form-label">
                    <validation-message [control]="getControl('descricaoIndicador')">
                      Descrição do indicador
                        <form-helper-tooltip 
                          [texto]="projetoTooltip['descricaoIndicador']"> 
                        </form-helper-tooltip>
                    </validation-message>
                  </label>
                  <textarea
                    class="form-control"
                    formControlName="descricaoIndicador"
                    rows="4"
                    maxlength="2000"
                  ></textarea>
                </div>
                <div class="col-md-4 mb-2 mb-md-0">
                  <label for="descricaoMeta" class="form-label">
                    <validation-message [control]="getControl('descricaoMeta')">
                      Descrição da Meta
                        <form-helper-tooltip 
                          [texto]="projetoTooltip['descricaoMeta']"> 
                        </form-helper-tooltip>
                    </validation-message>
                  </label>
                  <textarea
                    class="form-control"
                    formControlName="descricaoMeta"
                    rows="4"
                    maxlength="2000"
                  ></textarea>
                </div>
              </div>
            </div>
            <div *ngIf="isModoEdicao && isIndicadorAtivo(i)" class="d-flex justify-content-between align-items-center mb-2">
              <button
                *ngIf="isModoEdicao || !isIndicadorAtivo(i)"
                type="button"
                ngbTooltip="Remover Indicador do DIC"
                class="btn btn-outline-danger rounded-circle"
                (click)="isNovoMembro(i) ? removerIndicador(i) : marcarIndicadorExcluido(i)">
                <i class="fa-solid fa-minus remove-btn-icon"></i>
              </button>
            </div>
          </form>
        </ng-container>
        <div *ngIf="isModoEdicao" class="d-grid mt-3">
          <button type="button" class="btn btn-outline-primary" 
            (click)="adicionarIndicador()">
            <i class="fas fa-plus me-2"></i>Adicionar Novo Indicador
          </button>
        </div>
    </div>
  </div>
</div>

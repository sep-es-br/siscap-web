<div class="card mt-3" *ngIf="indicadoresFormArray.length > 0">
  <div class="card-body row gy-2 mb-0">
    <ng-container *ngFor="let indicadorFormGroup of indicadoresFormArray.controls; index as i">
      <form [formGroup]="indicadorFormGroup" >
        <div class="card mb-2">
          <div class="card-body d-flex flex-column flex-md-row align-items-start justify-content-between" >
            <div class="col-md-3 mb-2 mb-md-0">
              <strong>{{ getTipoIndicadorNome(indicadorFormGroup.value.idTipoIndicador) }}</strong>
            </div>
            <div class="col-md-4 mb-2 mb-md-0">
              <input
                type="text"
                class="form-control"
                formControlName="descricao"
                placeholder="Descrição do indicador"
              />
            </div>
            <div class="col-md-3 mb-2 mb-md-0">
              <input
                type="text"
                class="form-control"
                formControlName="meta"
                placeholder="Meta"
              />
            </div>
            <div class="col-md-2 text-end">
              <button
                type="button"
                class="btn btn-outline-danger btn-sm"
                (click)="removerIndicador(i)"
                *ngIf="isModoEdicao"
              >
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      </form>
    </ng-container>
  </div>
</div>

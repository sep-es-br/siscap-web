<div class="col-12">
  <div class="card mb-3">
    <div class="card-body">
		<ng-container *ngFor="let acoesFormGroup of acoesService.acoesFormArray.controls; index as i">
			<form [formGroup]="acoesFormGroup" >
				<div class="d-flex justify-content-between align-items-center mb-2">
					<h6 class="mb-0">Ação #{{i + 1}}</h6>
					<button type="button" class="btn btn-sm btn-outline-danger" 
            (click)="removerAcao(i)">
						<i class="fas fa-trash"></i>
					</button>
				</div>
				<div class="row g-2">
          <div class="col-12 col-md-8">
            <label [for]="'acaoNome_' + i" class="form-label">
              Ação Principal
                <form-helper-tooltip 
                  [texto]="projetoTooltip['descricaoAcaoPrincipal']"> 
                </form-helper-tooltip>
            </label>
            <input
              type="text"
              class="form-control"
              [id]="'acaoNome_' + i"
              formControlName="descricaoAcaoPrincipal"
              maxlength="2000" />
          </div>
          <div class="col-12 col-md-4">
            <label [for]="'acaoValor_' + i" class="form-label">
              Valor Estimado (R$)
                <form-helper-tooltip 
                  [texto]="projetoTooltip['valorEstimadoAcaoPrincipal']"> 
                </form-helper-tooltip>
            </label>
           <input
              mask="separator.2"
              prefix="R$"
              thousandSeparator="."
              decimalMarker=","
              [inputTransformFn]="rtlCurrencyInputTransformFn"
              [outputTransformFn]="rtlCurrencyOutputTransformFn"
              type="text"
              class="form-control"
              [id]="'acaoValor_' + i"
              formControlName="valorEstimadoAcaoPrincipal"
              placeholder="0,00"/>
          </div>
          <div class="col-12">
            <label [for]="'acaoDescricao_' + i" class="form-label">
              Descrição de ações secundárias e produtos
                <form-helper-tooltip 
                  [texto]="projetoTooltip['descricaoAcoesSecudariasProdutos']"> 
                </form-helper-tooltip>
            </label>
            <textarea
              class="form-control"
              [id]="'acaoDescricao_' + i"
              formControlName="descricaoAcaoSecundaria"
              rows="3"
              maxlength="2000"></textarea>
          </div>
				</div>
			</form>
		</ng-container>
		<div class="d-grid mt-3">
			<button type="button" class="btn btn-outline-primary" 
				(click)="adicionarAcao()">
				<i class="fas fa-plus me-2"></i>Adicionar Nova Ação
			</button>
		</div>
    </div>
  </div>
</div>

<ng-content></ng-content>

<ng-container *ngIf="isRequired && exibirObrigatorio">
  <span class="error-message"> *</span>
</ng-container>

<ng-container *ngIf="exibirErros && abstractControl.touched && abstractControl.errors">
  <span class="error-message" [class.float-end]="alinhamento === 'direita'">
    {{ mapErrorMessages(abstractControl.errors) }}
  </span>
</ng-container>

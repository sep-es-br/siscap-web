<div class="modal-header bg-warning-subtle">
  <h4 class="modal-title">{{ MENSAGENS.ATENCAO }}</h4>
</div>
<div class="modal-body text-center">
  <p class="fw-bold">{{ nomeProjeto }}</p>
  <p>O DIC selecionado já está vinculado ao seguinte programa:</p>
  <p class="fw-bold">{{ nomePrograma }}</p>
  <p>Vincular o DIC a este programa irá desvinculá-lo do programa acima!</p>
</div>

<div class="modal-footer d-flex justify-content-center">
  <siscap-botao
    [propriedades]="botaoEntendi"
    (acao)="activeModal.dismiss()"
  ></siscap-botao>
</div>

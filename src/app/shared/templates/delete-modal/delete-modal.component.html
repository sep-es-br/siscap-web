<siscap-modal [titulo]="MENSAGENS.ATENCAO">
  <div modalBody>
    <div class="text-center">
      <p>{{ MENSAGENS.VOCE_ESTA_PRESTES_A_DELETAR_O_SEGUINTE_REGISTRO }}</p>
      <p class="fw-bold">{{ conteudo }}</p>
      <p>{{ MENSAGENS.ESSA_ACAO_NAO_PODERA_SER_DESFEITA_TEM_CERTEZA_QUE_DESEJA_CONTINUAR }}</p>
    </div>
    <div *ngIf="exigirJustificativa" class="mt-4">
      <label for="justificativa" class="fw-bold">{{ MENSAGENS.JUSTIFICATIVA_2 }}</label>
      <textarea
        rows="5"
        class="form-control"
        id="justificativa"
        [(ngModel)]="justificativa"
        maxlength="499"
        [required]="exigirJustificativa"
      ></textarea>
    </div>
  </div>
  <div modalFooter class="siscap-modal-actions">
    <siscap-botao
      [propriedades]="botaoVoltar"
      (acao)="activeModal.dismiss()"
    ></siscap-botao>
    <siscap-botao
      [propriedades]="botaoProsseguir"
      (acao)="confirmar()"
    ></siscap-botao>
  </div>
</siscap-modal>

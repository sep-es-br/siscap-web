<div class="modal-header bg-danger-subtle">
  <h4 class="modal-title">Atenção!</h4>
  <button class="btn-close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body text-center">
  <p>Você está prestes a deletar o seguinte registro:</p>
  <p class="fw-bold">{{ conteudo }}</p>
  <p>Essa ação não poderá ser desfeita. Tem certeza que deseja continuar?</p>
</div>
<div class="modal-body text-left pt-0" 
   *ngIf="exigirJustificativa">
  <div class="fw-bold">Justificativa:</div>
  <textarea
    rows="5"
    class="form-control"
    id="justificativa"
    [(ngModel)]="justificativa"
    maxlength="499"
    [required]="exigirJustificativa"
  ></textarea>
</div>
<div class="modal-footer d-flex justify-content-center">
  <siscap-botao
    [propriedades]="botaoVoltar"
    (acao)="activeModal.dismiss()"
  ></siscap-botao>
  <siscap-botao
    [propriedades]="botaoProsseguir"
    (acao)="confirmar()"
  ></siscap-botao>
</div>

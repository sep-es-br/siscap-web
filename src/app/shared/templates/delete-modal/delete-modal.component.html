<div class="modal-header bg-danger-subtle">
  <h4 class="modal-title">{{ MENSAGENS.ATENCAO }}</h4>
  <button class="btn-close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body text-center">
  <p>{{ MENSAGENS.VOCE_ESTA_PRESTES_A_DELETAR_O_SEGUINTE_REGISTRO }}</p>
  <p class="fw-bold">{{ conteudo }}</p>
  <p>{{ MENSAGENS.ESSA_ACAO_NAO_PODERA_SER_DESFEITA_TEM_CERTEZA_QUE_DESEJA_CONTINUAR }}</p>
</div>
<div class="modal-body text-left pt-0" 
   *ngIf="exigirJustificativa">
  <div class="fw-bold">{{ MENSAGENS.JUSTIFICATIVA_2 }}</div>
  <textarea
    rows="5"
    class="form-control"
    id="justificativa"
    [(ngModel)]="justificativa"
    maxlength="499"
    [required]="exigirJustificativa"
  ></textarea>
</div>
<div class="modal-footer d-flex justify-content-center">
  <siscap-botao
    [propriedades]="botaoVoltar"
    (acao)="activeModal.dismiss()"
  ></siscap-botao>
  <siscap-botao
    [propriedades]="botaoProsseguir"
    (acao)="confirmar()"
  ></siscap-botao>
</div>
